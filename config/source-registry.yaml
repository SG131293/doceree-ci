# Doceree Source Registry - Day-1 50-source MVP cohort
# Source of truth: docs/reference/master_prd.md, Section 11 (Prioritized MVP
# Monitoring List), Section 7 (Source Type Taxonomy), Section 9 (Collection
# Method Policy).
#
# Cohort rule (per SCOPE_LOCK.md): only the 50-source MVP cohort is scheduled
# by default. Post-MVP sources stay inactive unless promoted by Sherry.
#
# Frequency mapping (per master PRD Section 8):
#   daily   - Tier-1 priority-1 sources (homepages, press, IR feeds)
#   weekly  - Tier-1 priority-2 sources (blogs, careers, case studies)
#   monthly - Tier-3 entries (none in this v1 cohort)
#
# collection_method options (per Section 9):
#   rss          - feedparser-friendly RSS
#   sitemap      - sitemap.xml diff (delta urls fetched + extracted)
#   crawler      - direct HTTP fetch + selectolax parse
#   ats_api      - public ATS JSON (Greenhouse/Lever/Ashby) - none in v1 cohort yet
#   sec_edgar    - SEC EDGAR full-text search API - added in Day 16
#
# Note on RSS: most healthcare-vendor sites do NOT publish RSS for press releases.
# Where RSS is unconfirmed, we fall back to sitemap diff. Day 6 implements RSS
# only; sitemap support lands Day 17.

