# ===== Source-type taxonomy reference =====
# Keep this list in sync with master_prd.md Section 7 when adding new source types.
source_types_allowed:
  - homepage
  - product_page
  - solution_page
  - pricing_page
  - blog
  - resource_center
  - newsroom
  - press_release
  - case_study
  - customer_story
  - docs
  - release_notes
  - partner_page
  - integration_page
  - events_webinars
  - careers
  - investor_relations
  - youtube       # via YouTube Data API only (Day 16)
  - podcast       # via RSS only
  - sec_filing    # via SEC EDGAR API only (Day 16)
  - github_repo   # via GitHub API only (Day 16)
  - reddit_thread # via Reddit JSON API only (Day 16)
  - uspto_patent  # via USPTO PatentsView API only (Day 16)
  - comparison_page  # SERP-triggered (Day 17+)

# ===== Source types EXCLUDED from automation (per SCOPE_LOCK.md) =====
source_types_excluded:
  - linkedin_company_page
  - linkedin_profile
  - private_social
  - paywalled_analyst_report
  - gated_webinar
  - paid_report
  - login_required_portal
  - captcha_gated
  - private_group
  - contact_database
  - review_site_unapproved
  - patent_database  # MVP exclusion only; USPTO PatentsView added later
  - trademark_database
  - ad_library
