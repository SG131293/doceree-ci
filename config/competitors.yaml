# Doceree Competitor Registry - canonical seed
# Source of truth: docs/reference/master_prd.md, Section 3 (Master Competitor List),
# Section 5 (Competitor Deep Dives), Section 10 (Signal Watchlist), Section 11
# (Prioritized MVP Monitoring List), Section 12 (AI-ready JSON).
#
# Three groups in this file:
#   tier_1               - direct head-to-head competitors (master PRD Section 3
#                          Tier-1); monitored daily on Priority-1 sources.
#   tier_2_mvp_cohort    - master PRD Tier-2 competitors that have entries in the
#                          50-source Day-1 MVP cohort (per Section 11 priority
#                          list). Monitored weekly on Priority-2; monthly on
#                          Priority-3. Komodo Health is #10 in master PRD priority.
#   healthcare_ai_cluster - per the build plan, the agentic-AI / AI-scribe cluster
#                          relevant to RepTwin and (adjacently) Publisher AI Suite.
#                          Synthio Labs and Hippocratic AI come from the master PRD;
#                          the rest are seeded from public knowledge of the AI-scribe
#                          category and flagged needs_validation: true.
#
# Tier-3 entries from the master PRD are intentionally excluded from v1; they can be
# promoted later via PR. SCOPE_LOCK rule: only the 50-source MVP cohort is scheduled
# by default.
#
# Field reference (per build plan Day 2 spec):
#   id, name, canonical_domain, rss_feeds, sitemaps, sec_cik (if public),
#   public_jobs_boards, related_doceree_products, rep_priority (1-5).

