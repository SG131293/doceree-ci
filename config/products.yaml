# Doceree Product Spine - canonical seed
# Source of truth: docs/reference/master_prd.md, Section 3 (Master Product Registry)
# and Section 4 (Product-by-Product Deep Dive).
#
# Each product entry is the spine for downstream stages:
#   - filter / extract: keywords + negative_keywords gate inclusion
#   - signal-mapping: rules in signal-mapping.yaml reference these product IDs
#   - synth_per_product: one section per product in the daily digest
#   - render: product sections in the email use `name` + `one_line`
#
# Claims taxonomy (from SCOPE_LOCK.md):
#   confirmed_claims          - safe to use as approved Doceree messaging
#   inferred_claims           - must remain labeled as inferred
#   needs_confirmation_claims - must NOT be used as approved positioning
#
# Note: master PRD lists 16 products (Section 3 registry). Sherry's review
# in Sprint 8 narrowed the active product set to 14 by removing AQS
# (audience-scoring; folded into Marketplace) and CIS (clinical-intent
# signals; subsumed by NEXT). Both can be re-added later as discrete
# products if the positioning changes.

version: 1

products:
  # ===== Demand-side products (1-8) =====

  - id: marketplace
    name: Marketplace
    one_line: "Custom-first HCP audience-construction platform built on verified clinical, behavioral, and EHR signals; activates in Doceree or any external DSP via LiveRamp."
    journey_stages: [audience_matching]
    confirmed_claims:
      - "Custom-first HCP audience construction platform"
      - "Live EHR intelligence in audience definition"
      - "Build once, activate anywhere through LiveRamp"
      - "Privacy-by-design with masked HCP IDs"
      - "6M+ verified HCPs available for construction"
      - "185+ EHR and health-system integrations underpinning live signal ingestion"
      - "50+ HCP attributes available for audience construction"
    inferred_claims: []
    needs_confirmation_claims:
      - "Specific audience-construction SLA"
      - "Specific Rx-lift outcomes attributable to Marketplace"
      - "Pricing model and minimum commitments"
      - "EU consent posture for activations via LiveRamp"
    keywords:
      - hcp audience
      - hcp marketplace
      - audience construction
      - npi audience
      - prescriber segment
      - hcp identity
      - real-time clinical data
      - audience engineering
      - liveramp
      - claims data audience
      - rwd audience
    negative_keywords:
      - retail marketplace
      - amazon marketplace
      - etsy
      - app marketplace
      - nft marketplace
      - real-estate marketplace
    competitors_primary: [iqvia, komodo_health, definitive_healthcare]
    competitors_adjacent: [swoop, deepintent, pulsepoint, lasso]

