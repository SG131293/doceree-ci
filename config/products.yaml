    needs_confirmation_claims:
      - "Specific account-lift outcome ranges"
      - "ABM pricing model"
      - "Whether ABM has POC compliance certification (battlecard mentions POC compliance which appears to be a templating error)"
      - "'Largest healthcare ABM' as an absolute claim"
    keywords:
