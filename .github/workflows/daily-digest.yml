name: daily-digest

# Triggers:
#   schedule:           00:30 UTC = 06:00 IST every day
#   workflow_dispatch:  manual run from the Actions UI for verification.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not send the email; only build artifacts)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      max_items:
        description: "Max RSS items per competitor feed (default 10)"
        required: false
        default: "10"
        type: string

# `contents: write` is for the Day-23 gh-pages publish step. Not used yet, but
# pinning it now means later workflow updates do not reduce the surface area.
permissions:
  contents: write

# Serialize daily-digest runs. cancel-in-progress=false means a manual trigger
# while the cron run is mid-flight queues behind it instead of killing it.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show pinned versions (debug)
        run: |
          python --version
          pip list | head -n 50

      - name: Run daily digest
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_USER_EMAIL: ${{ secrets.GMAIL_USER_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          MAX_ITEMS_INPUT: ${{ inputs.max_items }}
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p out

          # Default to a real send (cron path always sends). Manual triggers
          # can flip to --dry-run via the workflow_dispatch input.
          DRY_RUN_FLAG=""
          if [ "${DRY_RUN_INPUT}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          # workflow_dispatch input is a string; default to 10 when missing.
          MAX_ITEMS="${MAX_ITEMS_INPUT:-10}"

          python scripts/run_daily.py \
            ${DRY_RUN_FLAG} \
            --max-items "${MAX_ITEMS}" \
            --out-dir out 2>&1 | tee out/run.log

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: daily-digest
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Notification failures must NOT mask the original job failure.
        run: |
          python scripts/notify_failure.py || echo "notify_failure exited non-zero (continuing)"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-${{ github.run_id }}
          path: |
            out/run.log
            out/findings.jsonl
            out/digest.txt
            out/subject.txt
          retention-days: 30
          if-no-files-found: ignore
